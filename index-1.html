<title>Mentor IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna pensada per al mòbil. Capçalera, estadístiques, ruta de lliçons per mòduls, premis. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --soft:#e2eaee; --fg:#0f1d26; --muted:#556772; --line:#d3dde2;
  --accent:#c94707; --accent-ink:#ffffff; --teal:#0a7487;
  --good:#12805c; --good-bg:#dcf2e8; --bad:#b42318; --bad-bg:#fbe3e0;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1820; --surface:#13242e; --soft:#1a2f3b; --fg:#e8f0f4; --muted:#93a7b2; --line:#26394a;
    --accent:#ff8a4c; --accent-ink:#1c0d04; --teal:#4cc3d9;
    --good:#4ad1a0; --good-bg:#12372c; --bad:#ff9a90; --bad-bg:#40201d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1820; --surface:#13242e; --soft:#1a2f3b; --fg:#e8f0f4; --muted:#93a7b2; --line:#26394a;
  --accent:#ff8a4c; --accent-ink:#1c0d04; --teal:#4cc3d9;
  --good:#4ad1a0; --good-bg:#12372c; --bad:#ff9a90; --bad-bg:#40201d; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:9.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.stats{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-family:var(--mono);font-size:1.5rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:var(--soft);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.lvl{margin-top:8px;font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lvl b{color:var(--fg)}
.cta{display:grid;gap:10px;margin-top:14px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.teal{background:var(--teal);color:var(--accent-ink)}
.btn small{display:block;font-weight:500;opacity:.9;font-size:.82rem}
.mod{margin-top:30px}
.mod h2{font-size:1.25rem}
.mod p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.mtag{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700}
.lessons{display:grid;gap:10px;margin-top:12px}
.les{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.les[disabled]{opacity:.5;cursor:not-allowed}
.les .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;border:2px solid var(--line);color:var(--muted)}
.les.open .n{border-color:var(--accent);color:var(--accent)}
.les.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.les b{display:block;font-weight:600;line-height:1.25}
.les em{font-style:normal;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.les .xp{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.badge{padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;border:1.5px dashed var(--line);color:var(--muted)}
.badge.on{border:1.5px solid var(--good);background:var(--good-bg);color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:30px}
.card h2{font-size:1.1rem}
.card p{margin:8px 0 0;color:var(--muted);font-size:.93rem}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600;font-size:.93rem}
.names{display:grid;gap:8px;margin-top:10px}
.names label{font-size:.82rem;color:var(--muted);display:grid;gap:4px}
.names input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);min-width:0;width:100%}
/* lliçó */
.lt{display:flex;align-items:center;gap:12px}
.back{border:0;background:var(--soft);border-radius:50%;width:38px;height:38px;flex:none;font-size:1.1rem}
.pg{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.pg i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.stage{margin-top:26px;display:grid;gap:16px}
.kick{font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:700}
.stage h2{font-size:1.65rem;letter-spacing:-.01em}
.stage p.big{font-size:1.1rem;margin:0}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;width:100%}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.why{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:.95rem}
.prompt{position:relative;background:var(--soft);border-radius:12px;padding:14px;font-family:var(--mono);font-size:.84rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.big-xp{font-family:var(--mono);font-size:3rem;font-weight:700;color:var(--accent);letter-spacing:-.04em}
.row{display:grid;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap" id="app"></div>
<script>
/* ---------- Contingut ---------- */
/* En cada pregunta, la primera opció és la correcta; es barregen en mostrar-les. */
var MODS=[
{t:'Bases',d:'Què hi ha dins la IA',ls:[
 {id:'m1a',t:'Un endevinador de paraules',
  s:[{h:'Predir el text que ve',p:'Un model com Claude ha après de milions de textos. Quan li escrius, calcula quin tros de text encaixa millor a continuació i així va component la resposta.'},
     {h:'No és un cercador',p:'No busca la resposta en una base de dades: la construeix al moment. Per això pot sonar molt segur fins i tot quan s\'equivoca.'},
     {h:'Per què serveix igualment',p:'Tanta lectura li permet resumir, explicar, traduir, programar i donar idees. Tu poses la direcció; ella fa de col·laboradora ràpida.'}],
  q:[{q:'Com genera una resposta un model de llenguatge?',o:['Component el text segons què encaixa millor a continuació','Copiant una pàgina web sencera','Preguntant a una persona darrere la pantalla'],w:'Construeix el text pas a pas a partir del que ha après.'},
     {q:'Per què pot sonar segur i equivocar-se alhora?',o:['Perquè construeix la resposta, no la consulta en una font fixa','Perquè sempre menteix','Perquè dubta de tot'],w:'Sonar bé i ser cert són coses diferents.'}],
  k:'Explica\'m com funciones, com si jo tingués 12 anys. Fes servir una analogia amb el teclat del mòbil i dóna\'m 2 exemples.'},
 {id:'m1b',t:'Punts forts i punts febles',
  s:[{h:'Hi destaca',p:'Resumir, reescriure, traduir, explicar conceptes, fer esquemes, escriure codi i donar idees.'},
     {h:'Hi flaqueja',p:'Dades molt concretes o recents sense consultar una font, càlculs llargs fets de memòria i detalls que no li has donat.'},
     {h:'Regla pràctica',p:'Com més fàcil et sigui comprovar la resposta, més segur és delegar-la. En dades importants, demana fonts i contrasta.'}],
  q:[{q:'Quina tasca li va millor?',o:['Resumir un text llarg','Saber el teu número de compte','Saber què ha passat avui al teu barri sense buscar'],w:'Treballar amb un text que li dones és el seu fort.'},
     {q:'Si una dada és important, què fas?',o:['Demano fonts i la contrasto','La dono per bona','Ho deixo córrer'],w:'La comprovació és cosa teva.'}],
  k:'Dóna\'m 5 tasques en què ets molt bona i 5 en què he de verificar el que diguis. Explica el perquè de cadascuna.'},
 {id:'m1c',t:'La finestra de context',
  s:[{h:'Només veu la conversa',p:'Dins d\'un xat, la IA treballa amb el que hi ha escrit: les teves preguntes, les seves respostes i els fitxers que hi poses.'},
     {h:'Xat nou, full en blanc',p:'Un xat nou no sap què vau parlar en un altre, tret que l\'eina tingui memòria activada. Si és important, torna a donar-li context.'},
     {h:'Xats massa llargs',p:'En converses molt llargues pot perdre detalls de l\'inici. Si es despista, demana-li un resum i comença un xat nou amb ell.'}],
  q:[{q:'Comences un xat nou sobre un tema que ja heu tractat. Què fas?',o:['Li dono un resum del context','Suposo que ho recorda tot','No li dic res'],w:'Un xat nou parteix de zero.'},
     {q:'Un xat s\'ha fet enorme i es despista. El millor és…',o:['Demanar un resum i començar un xat nou','Insistir cridant més','Esborrar l\'app'],w:'Un resum net recupera el fil.'}],
  k:'Resumeix tot el que hem parlat fins ara en 5 punts, perquè pugui enganxar-ho en un xat nou.'}
]},
{t:'Parlar-hi bé',d:'Peticions que funcionen',ls:[
 {id:'m2a',t:'Una petició que funciona',
  s:[{h:'Quatre ingredients',p:'Digues qui ha de ser (rol), la situació (context), què vols (objectiu) i com ho vols (format).'},
     {h:'Fluix contra bo',p:'Fluix: «Ajuda\'m amb un correu». Bo: «Ets assessora laboral. Vull demanar un canvi d\'horari al meu cap. Redacta un correu de 5 línies, amable i directe».'},
     {h:'Detalls que canvien tot',p:'El públic, el to, la llargada i el que cal evitar fan la resposta útil a la primera.'}],
  q:[{q:'Quin d\'aquests NO és un ingredient bàsic?',o:['Escriure en majúscules','Context','Format'],w:'Rol, context, objectiu i format.'},
     {q:'Quina petició és millor?',o:['Menú setmanal per a 2 persones, sense gluten, plats de menys de 30 minuts','Fes-me un menú','Menú'],w:'Més context, resposta més útil.'}],
  k:'Vull organitzar un sopar amb amics dissabte. Actua com a cuiner casolà: som 6 persones, tinc 40 € i una persona és vegetariana. Dóna\'m un menú de 3 plats i la llista de la compra en una taula.'},
 {id:'m2b',t:'Itera: el primer intent és un esborrany',
  s:[{h:'No cal encertar a la primera',p:'Les millors respostes arriben després de 2 o 3 ajustos. Digues què canviar: més curt, més formal, afegeix un exemple.'},
     {h:'Mostra\'n un exemple',p:'Si tens un text que t\'agrada, enganxa\'l i digues «escriu com aquest». Un exemple val més que cent adjectius.'},
     {h:'Digues què no vols',p:'«Sense tecnicismes» o «evita frases fetes» tanquen camins i estalvien voltes.'}],
  q:[{q:'La primera resposta no et convenç. El millor és…',o:['Demanar ajustos concrets','Rendir-me','Canviar d\'eina sense provar res'],w:'Els ajustos concrets són el mètode.'},
     {q:'Com aconsegueixes que copiï un estil?',o:['Passant-li un exemple','Dient-li «fes-ho bé»','Esperant que ho endevini'],w:'L\'exemple marca la direcció.'}],
  k:'Escriu un missatge de 3 línies per felicitar un company pel seu nou càrrec. Després et diré com ajustar-lo: més càlid, més curt o més formal.'},
 {id:'m2c',t:'Que sigui ella qui pregunti',
  s:[{h:'Deixa que et pregunti',p:'Afegeix «abans de respondre, fes-me les preguntes que necessitis». Així no ha d\'endevinar res.'},
     {h:'Ideal per decidir',p:'Per triar un viatge, una compra o un pla d\'estudi, les seves preguntes et fan veure criteris que no havies pensat.'},
     {h:'Una cada vegada',p:'Si vols una conversa àgil, demana-li que pregunti d\'una en una.'}],
  q:[{q:'Per què demanar-li que et faci preguntes?',o:['Perquè treballi amb el que realment necessites','Perquè vagi més lenta','Perquè no sap res'],w:'Menys suposicions, millor resultat.'},
     {q:'Quina frase ho activa?',o:['Abans de respondre, fes-me les preguntes que necessitis','Respon ja','Sigues breu'],w:'Aquesta frase obre el diàleg.'}],
  k:'Vull aprendre a fer servir la IA cada dia en 10 minuts. Abans de proposar-me res, fes-me una pregunta cada vegada sobre el meu nivell, els meus objectius i el meu temps.'}
]},
{t:'IA al dia a dia',d:'Tasques que ja pots delegar',ls:[
 {id:'m3a',t:'Resumir i entendre',
  s:[{h:'Enganxa i demana',p:'Enganxa un correu, un contracte o un article i demana: «resumeix en 5 punts i digues què he de fer».'},
     {h:'La versió que et serveix',p:'Amb accions, amb dates o explicat a un nen de 10 anys. Mateix text, formats diferents.'},
     {h:'Revisa-ho',p:'En documents importants, comprova xifres i noms contra l\'original.'}],
  q:[{q:'Has enganxat un correu llarg. Què li demanes?',o:['Un resum i les accions que he de fer','Que el llegeixi a la meva parella','Res'],w:'Resum més accions: tens el correu desllorigat.'},
     {q:'Després del resum d\'un contracte…',o:['Comprovo els punts clau a l\'original','Firmo directament','No miro res més'],w:'Els punts clau es confirmen a la font.'}],
  k:'Et passo un text. Resumeix-lo en 5 punts, marca les dates i accions importants i digues què no queda clar. Text: [enganxa aquí un correu o un article]'},
 {id:'m3b',t:'Planificar',
  s:[{h:'Viatges, menús, rutines',p:'Dóna-li dates, pressupost i gustos. En segons munta un esborrany que pots ajustar.'},
     {h:'Demana opcions',p:'Demana 3 plans diferents, comparats en una taula, abans de triar.'},
     {h:'Confirma el que és real',p:'Horaris, preus i reserves canvien. Comprova\'ls a la font oficial.'}],
  q:[{q:'Per què demanar 3 plans?',o:['Per comparar i triar millor','Perquè n\'hi ha menys feina','Perquè sí'],w:'Comparar millora la decisió.'},
     {q:'Els horaris i preus que et dona…',o:['Cal confirmar-los a la font oficial','Són sempre correctes','No importen'],w:'Canvien i els pot errar.'}],
  k:'Planifica un cap de setmana a [ciutat] per a un pare i un fill adolescent. Pressupost: 300 €. Dóna\'m 3 opcions comparades en una taula.'},
 {id:'m3c',t:'Escriure millor',
  s:[{h:'Correus i missatges',p:'Dóna-li la idea en brut i el to que vols. Escriu-ho tu primer i que ella ho poleixi.'},
     {h:'Canvia el to',p:'El mateix missatge pot ser formal, amable o directe. Prova\'ls i tria.'},
     {h:'Que soni com tu',p:'Passa-li dos textos teus i demana que n\'imiti l\'estil.'}],
  q:[{q:'Quin és un bon flux de treball?',o:['Escric la idea i ella la poleix','Ella escriu tot i jo ho envio sense llegir','No faig servir la IA per escriure'],w:'Tu poses la idea, ella la poleix.'},
     {q:'Com fas que soni com tu?',o:['Li passo textos meus','Li dic «sigues tu»','No es pot'],w:'Els teus textos són la guia.'}],
  k:'Reescriu aquest missatge en versió formal, amable i directa: «Necessito el pressupost abans de divendres, si no, no puc tirar endavant». Explica\'m la diferència.'}
]},
{t:'Aprendre i crear',d:'Ideal per fer-ho en família',ls:[
 {id:'m4a',t:'Un tutor a la butxaca',
  s:[{h:'Explica-m\'ho a la meva manera',p:'Demana el nivell: «explica-m\'ho com si tingués 12 anys» o «explica-m\'ho com a professional».'},
     {h:'Aprèn practicant',p:'Demana\'n un test de 5 preguntes i que et corregeixi. Practicar fixa més que llegir.'},
     {h:'Un tema, un xat',p:'Manté un xat per tema. Així el fil del que has après es conserva.'}],
  q:[{q:'Com aprens més?',o:['Fent un test i corregint errors','Només llegint la resposta','Saltant als resultats'],w:'Recuperar la informació la fixa.'},
     {q:'Per ajustar el nivell d\'una explicació…',o:['Dic a qui va dirigida','No es pot','Espero i miro'],w:'Indica el públic i canviarà el nivell.'}],
  k:'Explica\'m la fotosíntesi en 3 passos. Després fes-me 5 preguntes tipus test, d\'una en una, i corregeix-me.'},
 {id:'m4b',t:'Idees i creativitat',
  s:[{h:'Pluja d\'idees',p:'Demana 20 idees sense filtrar i tria les 3 millors. La quantitat fa aparèixer la qualitat.'},
     {h:'Històries i jocs',p:'Inventeu junts una història, un joc de preguntes o un repte familiar.'},
     {h:'Tu poses el criteri',p:'La IA proposa; tu decideixes què val la pena.'}],
  q:[{q:'En una pluja d\'idees, primer…',o:['Demano moltes opcions','Només una','Cap'],w:'Moltes opcions i després triar.'},
     {q:'Qui decideix què és bo?',o:['Tu','La IA','Ningú'],w:'El criteri és humà.'}],
  k:'Inventem un joc de preguntes per a pare i fill sobre animals estranys. Proposa 3 formats diferents i fem-ne una ronda de 5 preguntes amb el que triï.'},
 {id:'m4c',t:'Fitxers, dades i imatges',
  s:[{h:'Puja\'n i pregunta',p:'Segons l\'eina, pots adjuntar PDF, fulls de càlcul o fotos i demanar-li que els llegeixi i els expliqui.'},
     {h:'Dades amb sentit',p:'Demana resums, gràfics o anomalies a partir d\'una taula, i que t\'expliqui com ho ha calculat.'},
     {h:'Foto més pregunta',p:'Una foto d\'una planta, un esquema o una factura i la pregunta justa.'}],
  q:[{q:'Què pots fer amb un PDF adjuntat?',o:['Demanar-ne un resum i fer-li preguntes','Res','Només imprimir-lo'],w:'Llegir i respondre sobre el contingut.'},
     {q:'Amb dades, a més del resultat demanes…',o:['Com ho ha calculat','Que no ho expliqui','Més colors'],w:'Veure el càlcul permet fiar-te\'n.'}],
  k:'Quan adjuntis un full de càlcul, prova: «Resumeix aquestes dades, troba tres patrons interessants i explica com ho has calculat».'}
]},
{t:'Ull viu',d:'Usar-la bé i amb seny',ls:[
 {id:'m5a',t:'Al·lucinacions',
  s:[{h:'Inventa amb seguretat',p:'A vegades omple un buit amb una dada falsa que sona real: noms, xifres, cites o enllaços.'},
     {h:'Com detectar-ho',p:'Demana fonts, pregunta «n\'estàs segura?» i comprova les dades clau en una font fiable.'},
     {h:'Millor amb fonts',p:'Si l\'eina pot buscar a internet, demana-li que ho faci i que citi d\'on ho treu.'}],
  q:[{q:'Què és una al·lucinació?',o:['Una dada inventada que sona real','Una resposta lenta','Una falta d\'ortografia'],w:'Sona bé però no és certa.'},
     {q:'Què fas amb una xifra important?',o:['La comprovo en una font fiable','La copio tal qual','Em fio'],w:'Les dades clau es verifiquen.'}],
  k:'Dóna\'m 3 dades sobre [tema] amb la font de cadascuna i digues quin nivell de confiança tens en cada una.'},
 {id:'m5b',t:'Privacitat',
  s:[{h:'Pensa abans d\'enganxar',p:'No comparteixis contrasenyes, targetes, documents d\'identitat, dades de salut ni dades d\'altres persones sense permís.'},
     {h:'Anonimitza',p:'Substitueix noms i dades reals per exemples: «Client A», «Empresa X».'},
     {h:'Revisa els ajustos',p:'Mira com l\'eina fa servir les teves converses i què pots desactivar. Amb menors, més atenció.'}],
  q:[{q:'Què NO has d\'enganxar en un xat?',o:['Una contrasenya','Una recepta','Un poema teu'],w:'Les contrasenyes mai.'},
     {q:'Per protegir una dada real…',o:['La substitueixo per un exemple','La deixo igual','La publico'],w:'Anonimitzar manté la utilitat.'}],
  k:'Fes-me una llista de comprovació de 6 punts per decidir què puc i què no puc compartir amb una IA, pensada per a una família amb un adolescent.'},
 {id:'m5c',t:'El següent nivell',
  s:[{h:'Tasques de diversos passos',p:'Algunes eines poden planificar, buscar, escriure i revisar sense que intervinguis a cada pas. Tu defineixes l\'objectiu i els límits.'},
     {h:'Connecta les teves apps',p:'Amb connectors, pot llegir el teu calendari, correu o documents si li dónes permís.'},
     {h:'Supervisa sempre',p:'Com més autonomia, més important és revisar el resultat abans de fer-lo servir.'}],
  q:[{q:'Amb més autonomia de la IA, tu…',o:['Revises el resultat','Deixes de mirar','Canvies d\'eina cada dia'],w:'Autonomia no vol dir absència de supervisió.'},
     {q:'En una tasca llarga, què defineixes?',o:['L\'objectiu i els límits','Només el color','Res'],w:'Objectiu i límits donen direcció.'}],
  k:'Vull automatitzar una tasca setmanal: [descriu-la]. Digues-me quins passos tindria, què podria fer una IA, què hauria de revisar jo i quins riscos hi veus.'}
]}
];
var FLAT=[];MODS.forEach(function(m,mi){m.ls.forEach(function(l){l.mod=mi;FLAT.push(l)})});
var TITLES=['Curiós','Explorador','Aprenent','Practicant','Competent','Estrateg','Mestre'];
var KEY='mentor-ia-v1';

/* ---------- Estat ---------- */
function blank(n){return {name:n,xp:0,done:{},streak:0,last:'',quick:0}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.p&&o.p.length===2)return o}}catch(e){}return {cur:0,p:[blank('Jo'),blank('Fill')]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load(),V={v:'home'};
function P(){return S.p[S.cur]}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ymd(d){return d.toLocaleDateString('sv')}
function today(){return ymd(new Date())}
function yest(){return ymd(new Date(Date.now()-864e5))}
function liveStreak(p){return (p.last===today()||p.last===yest())?p.streak:0}
function touch(p){var t=today();if(p.last===t)return;p.streak=(p.last===yest())?p.streak+1:1;p.last=t}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function opts(q){return shuffle(q.o.map(function(t,j){return {t:t,ok:j===0}}))}
function doneCount(p){return FLAT.filter(function(l){return p.done[l.id]}).length}
function unlocked(i){return i===0||!!P().done[FLAT[i-1].id]}
function level(xp){return Math.min(Math.floor(xp/50),6)}
function modDone(p,mi){return MODS[mi].ls.every(function(l){return p.done[l.id]})}
function badges(p){
  var n=doneCount(p);
  return [{n:'Primer pas',ok:n>=1},{n:'Ratxa de 3 dies',ok:liveStreak(p)>=3},{n:'Mòdul tancat',ok:MODS.some(function(m,i){return modDone(p,i)})},
    {n:'Mig camí',ok:n>=8},{n:'Repte ràpid x5',ok:p.quick>=5},{n:'Tot el camí',ok:n===FLAT.length}];
}

/* ---------- Vistes ---------- */
var app=document.getElementById('app');
function render(){
  if(V.v==='home')home();else if(V.v==='lesson')lesson();else quick();
  window.scrollTo(0,0);
}
function home(){
  var p=P(),lv=level(p.xp),pct=lv>=6?100:Math.round((p.xp%50)/50*100);
  var nextI=FLAT.findIndex(function(l){return !p.done[l.id]});
  var h='<div class="top"><div class="brand">Mentor <span>IA</span></div><div class="seg" role="group" aria-label="Perfil">'+
    S.p.map(function(x,i){return '<button data-act="prof" data-i="'+i+'" aria-pressed="'+(i===S.cur)+'">'+esc(x.name||'Perfil')+'</button>'}).join('')+'</div></div>';
  h+='<section class="stats"><div class="srow"><div class="stat"><b>'+p.xp+'</b><span>XP</span></div><div class="stat"><b>'+liveStreak(p)+'</b><span>Dies de ratxa</span></div><div class="stat"><b>'+doneCount(p)+'/'+FLAT.length+'</b><span>Lliçons</span></div></div>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
    '<div class="lvl"><span>Nivell '+(lv+1)+': <b>'+TITLES[lv]+'</b></span><span>'+(lv>=6?'Nivell màxim':'Falten '+((lv+1)*50-p.xp)+' XP per pujar')+'</span></div></section>';
  h+='<div class="cta">';
  if(nextI>=0)h+='<button class="btn" data-act="open" data-id="'+FLAT[nextI].id+'">Continua: '+esc(FLAT[nextI].t)+'<small>2 minuts · fins a +30 XP</small></button>';
  else h+='<div class="card" style="margin:0"><h2>Has completat tota la ruta</h2><p>Continua amb els reptes ràpids per mantenir-ho fresc.</p></div>';
  h+='<button class="btn ghost" data-act="quick">Repte ràpid d\'1 minut<small>Una pregunta, +3 XP si l\'encertes</small></button></div>';
  MODS.forEach(function(m,mi){
    h+='<section class="mod"><div class="mtag">Mòdul '+(mi+1)+' · '+m.ls.filter(function(l){return p.done[l.id]}).length+'/'+m.ls.length+'</div><h2>'+esc(m.t)+'</h2><p>'+esc(m.d)+'</p><div class="lessons">';
    m.ls.forEach(function(l){
      var i=FLAT.indexOf(l),d=!!p.done[l.id],u=unlocked(i);
      h+='<button class="les '+(d?'done':u?'open':'')+'" data-act="open" data-id="'+l.id+'"'+(u?'':' disabled')+'><span class="n">'+(d?'✓':(i+1))+'</span><span><b>'+esc(l.t)+'</b><em>2 min</em></span><span class="xp">'+(d?'Repàs':'+30 XP')+'</span></button>';
    });
    h+='</div></section>';
  });
  h+='<section class="card"><h2>Premis</h2><div class="badges">'+badges(p).map(function(b){return '<span class="badge'+(b.ok?' on':'')+'">'+b.n+'</span>'}).join('')+'</div></section>';
  h+='<section class="card"><h2>Compartir amb el teu fill</h2><p>Envia-li l\'enllaç d\'aquesta pàgina. Cada persona guarda el seu progrés al seu navegador. Si compartiu dispositiu, feu servir els dos perfils de dalt. Si canvies de navegador o esborres les dades, el progrés no et segueix.</p>'+
    '<details><summary>Canvia els noms dels perfils</summary><div class="names"><label for="n0">Perfil 1<input id="n0" maxlength="14" value="'+esc(S.p[0].name)+'"></label><label for="n1">Perfil 2<input id="n1" maxlength="14" value="'+esc(S.p[1].name)+'"></label></div></details></section>';
  app.innerHTML=h;
}
function pgbar(i,n){return '<div class="lt"><button class="back" data-act="home" aria-label="Torna a la ruta">←</button><div class="pg"><i style="width:'+Math.round(i/n*100)+'%"></i></div></div>'}
function optsHtml(o,picked,act){
  return '<div class="opts">'+o.map(function(x,i){
    var c='opt';if(picked>=0){if(x.ok)c+=' ok';else if(i===picked)c+=' no'}
    return '<button class="'+c+'" data-act="'+act+'" data-i="'+i+'"'+(picked>=0?' disabled':'')+'>'+esc(x.t)+'</button>';
  }).join('')+'</div>';
}
function lesson(){
  var st=V.steps[V.i],h=pgbar(V.i,V.steps.length)+'<div class="stage">';
  if(st.t==='s'){
    h+='<div class="kick">Idea '+(st.k+1)+' de '+V.l.s.length+'</div><h2>'+esc(st.s.h)+'</h2><p class="big">'+esc(st.s.p)+'</p><button class="btn" data-act="next">Següent</button>';
  }else if(st.t==='q'){
    h+='<div class="kick">Pregunta '+(st.k+1)+' de '+V.l.q.length+'</div><h2>'+esc(st.q.q)+'</h2>'+optsHtml(st.o,st.picked,'pick');
    if(st.picked>=0)h+='<div class="why">'+esc(st.q.w)+'</div><button class="btn" data-act="next">Continua</button>';
  }else if(st.t==='task'){
    h+='<div class="kick">Repte (opcional, +10 XP)</div><h2>Prova-ho amb una IA real</h2><p class="big">Copia aquesta petició, enganxa-la a Claude i mira què et respon. Canvia el que hi ha entre claudàtors.</p><div class="prompt" id="pr">'+esc(V.l.k)+'</div>'+
      '<div class="row"><button class="btn teal" data-act="copy" id="cp">Copia la petició</button><button class="btn" data-act="tried">Ja ho he provat, +10 XP</button><button class="btn ghost" data-act="skip">Ara no</button></div>';
  }else{
    var nx=FLAT.indexOf(V.l)+1,hasNext=nx<FLAT.length;
    h+='<div class="kick">Lliçó completada</div><h2>'+esc(V.l.t)+'</h2>'+(V.first?'<div class="big-xp">+'+V.gain+' XP</div><p class="big">'+V.ok+' de '+V.l.q.length+' preguntes encertades.'+(V.tried?' Has fet el repte.':'')+'</p>':'<p class="big">Repàs fet. Aquesta lliçó ja comptava, així que no suma XP nou.</p>')+
      '<div class="row">'+(hasNext?'<button class="btn" data-act="open" data-id="'+FLAT[nx].id+'">Següent: '+esc(FLAT[nx].t)+'</button>':'')+'<button class="btn ghost" data-act="home">Torna a la ruta</button></div>';
  }
  app.innerHTML=h+'</div>';
}
function quick(){
  var h=pgbar(0,1).replace('width:0%','width:0%')+'<div class="stage"><div class="kick">Repte ràpid</div><h2>'+esc(V.q.q)+'</h2>'+optsHtml(V.o,V.picked,'qpick');
  if(V.picked>=0)h+='<div class="why">'+(V.o[V.picked].ok?'Correcte, +3 XP. ':'Gairebé. ')+esc(V.q.w)+'</div><div class="row"><button class="btn" data-act="quick">Un altre repte</button><button class="btn ghost" data-act="home">Tanca</button></div>';
  app.innerHTML=h+'</div>';
}

/* ---------- Accions ---------- */
function startLesson(id){
  var l=FLAT.find(function(x){return x.id===id}),steps=[];
  l.s.forEach(function(s,k){steps.push({t:'s',k:k,s:s})});
  l.q.forEach(function(q,k){steps.push({t:'q',k:k,q:q,o:opts(q),picked:-1})});
  steps.push({t:'task'});steps.push({t:'end'});
  V={v:'lesson',l:l,steps:steps,i:0,ok:0,tried:false,gain:0,first:false};render();
}
function finish(){
  var p=P(),l=V.l;V.first=!p.done[l.id];
  if(V.first){V.gain=10+5*V.ok+(V.tried?10:0);p.xp+=V.gain;p.done[l.id]=1}
  touch(p);save();
}
function startQuick(){
  var p=P(),pool=FLAT.filter(function(l){return p.done[l.id]});if(!pool.length)pool=MODS[0].ls;
  var qs=[];pool.forEach(function(l){l.q.forEach(function(q){qs.push(q)})});
  var q=qs[Math.floor(Math.random()*qs.length)];
  V={v:'quick',q:q,o:opts(q),picked:-1};render();
}
function copyPrompt(btn){
  var txt=V.l.k;
  function fb(){var r=document.createRange();r.selectNodeContents(document.getElementById('pr'));var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Seleccionada, copia-la'}
  try{navigator.clipboard.writeText(txt).then(function(){btn.textContent='Copiada'},fb)}catch(e){fb()}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,i=+b.dataset.i;
  if(a==='prof'){S.cur=i;save();render()}
  else if(a==='open'){startLesson(b.dataset.id)}
  else if(a==='home'){V={v:'home'};render()}
  else if(a==='quick'){startQuick()}
  else if(a==='next'){V.i++;if(V.steps[V.i].t==='end')finish();render()}
  else if(a==='pick'){var st=V.steps[V.i];if(st.picked<0){st.picked=i;if(st.o[i].ok)V.ok++;render()}}
  else if(a==='copy'){copyPrompt(b)}
  else if(a==='tried'){V.tried=true;V.i++;finish();render()}
  else if(a==='skip'){V.i++;finish();render()}
  else if(a==='qpick'){if(V.picked<0){V.picked=i;var p=P();if(V.o[i].ok){p.xp+=3;p.quick++}touch(p);save();render()}}
});
document.addEventListener('change',function(e){
  var t=e.target;if(t.id==='n0'||t.id==='n1'){var k=+t.id.slice(1);S.p[k].name=t.value.trim()||('Perfil '+(k+1));save();render()}
});
render();
</script>

</html>
